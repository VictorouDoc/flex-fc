name: Mise à jour des games

on:
  schedule:
    - cron: "0 4 * * *" # tous les jours à 4h UTC
  workflow_dispatch: {} # bouton "Run workflow" manuel

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # puuids.json n'est jamais commité : on le garde d'un run à l'autre
      # via le cache Actions, sinon un compte renommé est perdu par le bot
      - name: Cache des PUUID
        uses: actions/cache@v4
        with:
          path: puuids.json
          key: puuids-${{ github.run_id }}
          restore-keys: puuids-

      - name: Récupérer les games
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node fetch_games.js

      - name: Commit si changement
        run: |
          git config user.name "flex-bot"
          git config user.email "actions@github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "maj auto des games"
          git push
